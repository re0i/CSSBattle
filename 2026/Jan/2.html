<div class="container">
    <div class="box bottom"></div>
    <div class="box top"></div>
    <div class="box bottom"></div>
    <div class="box top"></div>
</div>

<style>
    body {
        background: #4A9A86;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 95vh;
    }

    .container {
        display: flex;
        gap: 20px;
    }

    .box {
        width: 60px;
        height: 100px;
        border: 10px solid #FAE29E;
        position: relative;
    }

    .box::after {
        content: '';
        width: 30px;
        height: 30px;
        background: #FAE29E;
        border-radius: 50%;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
    }

    .box.top::after{
        top: 15px;
    }
    
    .box.bottom::after{
        bottom: 15px;
    }
</style>
