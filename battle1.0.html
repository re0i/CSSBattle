<style>
  body {
    margin: 0;
    height: 100vh;
    background: #4FA9C0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    position: relative;
    width: 300px;
    height: 400px;
  }

  .bar {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 65%;
    background: #F4DA64;
    z-index: 2;
  }

  .half {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 60px;
    background: #2B2A4A;
    border-radius: 50%;
  }

  .back {
    z-index: 1;
    clip-path: inset(0 0 49% 0);
  }

  .front {
    z-index: 3;
    clip-path: inset(50% 0 0 0);
  }

  .p1 { top: 90px; }
  .p2 { top: 160px; }
  .p3 { top: 230px; }
</style>

<div class="container">
  <!-- TOP halves (behind) -->
  <div class="half back p1"></div>
  <div class="half back p2"></div>
  <div class="half back p3"></div>

  <!-- CENTER BAR -->
  <div class="bar"></div>

  <!-- BOTTOM halves (front) -->
  <div class="half front p1"></div>
  <div class="half front p2"></div>
  <div class="half front p3"></div>
</div>
